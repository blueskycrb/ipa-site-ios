name: Build unsigned IPA

on:
  push:
    branches: [main]
    # 只有 App 本身变了才编译发版；改服务端（server/）或说明文档不会触发，App 也就不会提示无意义的更新
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write   # 发布 GitHub Release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 编译号用 Actions 的运行序号，每次编译都会变大，App 内「检查更新」靠它判断有没有新版
      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project IPASite.xcodeproj \
            -scheme IPASite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet \
            build

      - name: Show built Info.plist
        run: plutil -p build/Build/Products/Release-iphoneos/IPASite.app/Info.plist

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPASite.app Payload/
          zip -qry IPASite.ipa Payload
          ls -lh IPASite.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IPASite-unsigned
          path: IPASite.ipa

      # 每次编译发布一个 Release；最新版的固定下载地址：
      # https://github.com/blueskycrb/ipa-site-ios/releases/latest/download/IPASite.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=build/Build/Products/Release-iphoneos/IPASite.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          TAG="v${VERSION}-b${BUILD}"
          git log -1 --pretty=%B > notes.txt
          gh release create "$TAG" IPASite.ipa \
            --target "$GITHUB_SHA" \
            --title "IPA 下载 ${VERSION} (${BUILD})" \
            --notes-file notes.txt \
            --latest
