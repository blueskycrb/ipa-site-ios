name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project IPASite.xcodeproj \
            -scheme IPASite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Show built Info.plist
        run: plutil -p build/Build/Products/Release-iphoneos/IPASite.app/Info.plist

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPASite.app Payload/
          zip -qry IPASite-unsigned.ipa Payload
          ls -lh IPASite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IPASite-unsigned
          path: IPASite-unsigned.ipa
