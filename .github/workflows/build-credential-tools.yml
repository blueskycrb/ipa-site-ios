name: Build credential tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out FairPlay native tools
        uses: actions/checkout@v4
        with:
          repository: EthanArbuckle/fairplay-decrypt
          # Same revision used by the Windows / Docker helper; update together.
          ref: 7f80db2ef37634073fab06b3aad1aa0cf24561a1
          path: fairplay-decrypt
          persist-credentials: false
      - name: Install signing tool
        run: brew install ldid
      - name: Build device tools
        run: make -C fairplay-decrypt/credential-retrieval
      - name: Preserve executable permissions
        run: tar -czf credential-tools.tar.gz -C fairplay-decrypt/credential-retrieval/build bundle
      - name: Upload device tools
        uses: actions/upload-artifact@v4
        with:
          name: credential-tools
          path: credential-tools.tar.gz
          if-no-files-found: error
          retention-days: 14
