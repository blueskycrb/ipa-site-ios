name: IPASite
options:
  bundleIdPrefix: com.blueskycrb
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.10.0"
    # 编译号在 GitHub Actions 里用运行序号覆盖；本地编译时为 0
    CURRENT_PROJECT_VERSION: "0"
targets:
  IPASite:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: IPA 下载
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 服务器用 http（IP 或域名都可能），需要允许明文连接。
        # 不要再加 NSAllowsLocalNetworking：有它时 iOS 会忽略 NSAllowsArbitraryLoads，
        # 只放行 IP 地址，用域名访问会被 ATS 拦截。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接你内网里的 IPA 下载站服务器
        # 让存到手机的 IPA 出现在「文件」App 里
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 在微信、Safari、「文件」等 App 里可以把 IPA「用其他应用打开 → IPA 下载」，导入后签名安装
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - com.opa334.trollstore.tipa
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.opa334.trollstore.tipa
            UTTypeDescription: TrollStore App
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - tipa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueskycrb.ipasite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
