name: IPASite
options:
  bundleIdPrefix: com.blueskycrb
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  IPASite:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: IPA 下载
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 服务器用 http（IP 或域名都可能），需要允许明文连接。
        # 不要再加 NSAllowsLocalNetworking：有它时 iOS 会忽略 NSAllowsArbitraryLoads，
        # 只放行 IP 地址，用域名访问会被 ATS 拦截。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接你内网里的 IPA 下载站服务器
        # 让存到手机的 IPA 出现在「文件」App 里
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueskycrb.ipasite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
